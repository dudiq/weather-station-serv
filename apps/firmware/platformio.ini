[platformio]
src_dir = .
default_envs = lilygo-t5-47

[env:lilygo-t5-47]
platform = espressif32@6.9.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<firmware.ino> +<firmware.ino.cpp>
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#deae2d2cbfb062198e6b4647d29eab6bc4d80d8a
monitor_speed = 115200
upload_speed = 460800
